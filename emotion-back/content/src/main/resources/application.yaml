server:
  port: ${CONTENT_SERVICE_PORT:8091}

spring:
  application:
    name: content-service

  datasource:
    url: ${CONTENT_DB_URL:jdbc:postgresql://localhost:5433/help_book_db}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8081/eureka/}
    healthcheck:
      enabled: false

app:
  kafka:
    note-events-topic: ${KAFKA_NOTE_EVENTS_TOPIC:note-events}

logging:
  pattern:
    console: "%logger{36} [%-5level] %d{HH:mm:ss} - %msg%n"
